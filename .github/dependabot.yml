version: 2
updates:
  - package-ecosystem: npm
    directories: ['/server', '/web', '/e2e']
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Kept in step with the Playwright browsers; update deliberately.
      - dependency-name: '@playwright/test'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
